# Build and test on every push/PR. The DeckLink SDK is not in the repo,
# so the bridge builds in stub mode — this doesn't affect the core or GUI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes back to the repository; the Dependabot pull requests in
# particular should not be running with a writable token.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version

      # Forced, not assumed. This job is meant to be the configuration a
      # DOWNLOADED build has — no vendor SDKs — but until now it was that only
      # because the runner happens not to carry the headers. `__has_include`
      # answers about the machine, not the project: on the development Mac
      # `/opt/homebrew/include` carries `srt/srt.h` and `DeckLinkAPI.h`, and
      # those two bridges had therefore NEVER been compiled as stubs there,
      # with the suites describing a downloaded build never running at all.
      # A runner image that gains libsrt from Homebrew one week would do the
      # same to CI, silently. So the flag says what this job is for.
      - name: Build
        run: swift build -Xcc -DTAKESHOT_FORCE_STUBS=1

      - name: Lint
        # Style regressions are cheap to prevent and expensive to clean up in
        # bulk — the tree is at zero findings and stays there.
        run: |
          brew install swiftlint
          ./scripts/lint.sh lint --strict

      - name: Test
        run: ./scripts/test.sh -Xcc -DTAKESHOT_FORCE_STUBS=1

      - name: Build TakeShot.app
        env:
          # The artifact is the same configuration the suite above ran: every
          # bridge a stub, which is what a downloaded build is.
          TAKESHOT_BUILD_FLAGS: -Xcc -DTAKESHOT_FORCE_STUBS=1
        run: ./scripts/bundle-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent build/TakeShot.app build/TakeShot.zip

      - name: Build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TakeShot-${{ github.sha }}
          path: build/TakeShot.zip
          retention-days: 14

  # A data race in the localisation bundle crashed this workflow with SIGBUS
  # for days and never once reproduced on a developer machine — the timing
  # differs. ThreadSanitizer named it in a single run, so it runs here now.
  # Separate job: instrumented tests are several times slower, and a race is
  # not a reason to hold up the build artifact.
  thread-sanitizer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests under ThreadSanitizer
        run: ./scripts/test.sh --sanitize=thread -Xcc -DTAKESHOT_FORCE_STUBS=1
