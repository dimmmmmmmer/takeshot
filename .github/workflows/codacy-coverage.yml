# Run the tests with coverage, hold the number above the floor, and upload the
# report to Codacy.
#
# The measurement, the lcov export and the floor check all live in
# `scripts/coverage.sh`, so this job and the machine you develop on cannot
# disagree about the number. The floor itself is stated in `.coverage-floor` and
# nowhere else.
#
# The project token is stored in the CODACY_PROJECT_TOKEN repository secret
# (never committed). Codacy runs static analysis on its own side once the repo
# is connected on codacy.com — this workflow only handles coverage.
name: Codacy Coverage

on:
  push:
    branches: [main]
  pull_request:

# Coverage is pushed to Codacy with its own token; the GitHub token needs
# nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the suite, writes coverage.lcov and coverage-report.txt, then exits
      # non-zero when line coverage has fallen below `.coverage-floor` — naming
      # the measured number, the floor, and the files holding the most uncovered
      # lines. THIS step is the gate, so it is deliberately not
      # continue-on-error.
      #
      # The script drives the suite through `scripts/test.sh`, which passes
      # --no-parallel and the Command Line Tools framework paths. The serial run
      # is the suites' contract rather than a preference: the view tests share
      # UserDefaults.standard through @AppStorage, and every red this workflow
      # ever showed traced back to a parallel run racing those keys.
      - name: Tests with coverage, and the coverage floor
        run: scripts/coverage.sh

      - name: Upload to Codacy
        # don't fail CI: the upload only works once the repo is connected
        # on codacy.com (otherwise 'Request URL not found'). The floor above is
        # the gate; this step is only the dashboard.
        continue-on-error: true
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --force-coverage-parser lcov -r coverage.lcov
