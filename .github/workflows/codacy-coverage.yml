# Run the tests with coverage and upload the report to Codacy.
# The project token is stored in the CODACY_PROJECT_TOKEN repository secret
# (never committed). Codacy runs static analysis on its own side once the repo
# is connected on codacy.com — this workflow only handles coverage.
name: Codacy Coverage

on:
  push:
    branches: [main]
  pull_request:

# Coverage is pushed to Codacy with its own token; the GitHub token needs
# nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests with coverage
        # --no-parallel matches scripts/test.sh: the suites' contract is serial
        # execution — the view tests share UserDefaults.standard through
        # @AppStorage, and parallel runs raced each other's keys. Every red
        # this workflow ever showed traced back to that difference.
        run: |
          swift test --enable-code-coverage --no-parallel \
            -Xswiftc -F/Library/Developer/CommandLineTools/Library/Developer/Frameworks \
            -Xlinker -F/Library/Developer/CommandLineTools/Library/Developer/Frameworks \
            -Xlinker -rpath -Xlinker /Library/Developer/CommandLineTools/Library/Developer/Frameworks \
            -Xlinker -rpath -Xlinker /Library/Developer/CommandLineTools/Library/Developer/usr/lib

      - name: Export coverage to lcov
        run: |
          BIN=$(swift build --show-bin-path)
          PROF="$BIN/codecov/default.profdata"
          # every test bundle counts: the first is positional, the rest are
          # -object, otherwise a second test target drops out of the report
          OBJECTS=()
          while IFS= read -r XCTEST; do
              BINARY="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
              if [ ${#OBJECTS[@]} -eq 0 ]; then
                  OBJECTS+=("$BINARY")
              else
                  OBJECTS+=(-object "$BINARY")
              fi
          done < <(find "$BIN" -name '*.xctest' -maxdepth 2)
          echo "test bundles: ${#OBJECTS[@]}"
          xcrun llvm-cov export \
            "${OBJECTS[@]}" \
            -instr-profile "$PROF" \
            -format=lcov \
            -ignore-filename-regex='(Tests|\.build)/' \
            > coverage.lcov
          echo "lcov lines: $(wc -l < coverage.lcov)"

      - name: Upload to Codacy
        # don't fail CI: the upload only works once the repo is connected
        # on codacy.com (otherwise 'Request URL not found')
        continue-on-error: true
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --force-coverage-parser lcov -r coverage.lcov
