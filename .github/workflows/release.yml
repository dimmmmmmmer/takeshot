# Release on a vX.Y.Z tag: build TakeShot.app, wrap it in a .dmg, publish it
# with the operator notes from CHANGELOG.md.
#
# Two things about the artifact this produces, both deliberate and both stated
# on the release page itself by scripts/release-notes.sh:
#
#   * A GitHub runner has none of the CAMERA vendor SDKs — DeckLink, Blackmagic
#     RAW and R3D are not redistributable and nothing here fetches them — so
#     those three bridges are compiled as stubs. The published build therefore
#     sees NO capture device: it plays back, it exports, it runs the demo
#     source, and it cannot record from a board. Anyone who needs capture builds
#     from source with the DeckLink SDK (CONTRIBUTING.md).
#   * **libdatachannel IS built and shipped** (owner: "в релиз либдатаченел
#     клади"), so a downloaded build has a working live video page over WebRTC
#     against the demo source. It is MPL-2.0, so shipping it is distribution
#     under terms rather than a build flag — NOTICE and
#     vendor/libdatachannel/README.md carry the obligation, and both have to
#     stay true. It is built here rather than fetched because it exists in no
#     macOS package manager, which is also why the app has to carry its own
#     copy at all.
#   * **The runner is x86_64** (measured: a CodeQL run on this same image
#     reported `Target: x86_64-apple-macosx15.0`), so a tagged release is an
#     Intel build that runs under Rosetta on every Apple Silicon Mac. For a
#     capture and preview application that is a real cost, not a footnote, and
#     it is the reason the owner builds releases on his own machine and uploads
#     those. Anything published from here should be understood as the fallback
#     path, not the good one.
#   * Ad-hoc signing, no Developer ID, no notarization. First launch of a
#     download therefore needs right-click → Open, or
#     `xattr -d com.apple.quarantine /Applications/TakeShot.app`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and full history: the notes link back to the previous release,
          # and `git describe` cannot find it in a shallow clone.
          fetch-depth: 0

      # Before anything expensive. A tag that disagrees with the VERSION file
      # would publish a download whose About panel, diagnostics bundle and MHL
      # manifests all name a different build from the one on the release page —
      # the exact ambiguity the single VERSION file exists to prevent.
      - name: Tag and VERSION agree
        run: |
          VERSION="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' VERSION \
            | head -1 | tr -d '[:space:]')"
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match VERSION" \
                 "($VERSION). Bump VERSION and add its CHANGELOG.md section," \
                 "commit, then tag v$VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Fails when CHANGELOG.md has no section for this version, so a release
      # cannot go out with an empty body.
      - name: Release notes exist
        run: ./scripts/release-notes.sh "$VERSION" > /dev/null

      - name: Test
        run: ./scripts/test.sh

      # Built, not fetched: libdatachannel is in no macOS package manager, which
      # is the same fact that makes the app carry its own copy. Pinned to a tag
      # so a release is reproducible and cannot change under us between two
      # builds of the same version.
      #
      # The architecture follows the RUNNER's, deliberately — the vendor README
      # pins arm64 because that is the developer's machine, and hard-coding it
      # here would hand `bundle-app.sh` a dylib of the wrong architecture, which
      # it refuses (correctly). `OPENSSL_USE_STATIC_LIBS` is what makes the
      # result shippable at all: linked dynamically it would carry a Homebrew
      # path that exists on this runner and on no user's Mac.
      - name: Build libdatachannel
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          git clone --depth 1 --branch v0.24.5 --recurse-submodules \
            https://github.com/paullouisageneau/libdatachannel.git /tmp/ldc
          cmake -S /tmp/ldc -B /tmp/ldc/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build /tmp/ldc/build -j
          mkdir -p vendor/libdatachannel/lib vendor/libdatachannel/include
          cp -R /tmp/ldc/include/rtc vendor/libdatachannel/include/
          cp /tmp/ldc/build/include/rtc/version.h \
            vendor/libdatachannel/include/rtc/
          # -L on purpose: what CMake leaves at that name is a symlink, and a
          # symlink inside Contents/Frameworks is not a thing to sign or ship.
          cp -L /tmp/ldc/build/libdatachannel.dylib \
            vendor/libdatachannel/lib/libdatachannel.dylib
          # Say what shipped, so a release page can be checked against it.
          otool -L vendor/libdatachannel/lib/libdatachannel.dylib
          lipo -archs vendor/libdatachannel/lib/libdatachannel.dylib

      - name: Build TakeShot.app
        run: ./scripts/bundle-app.sh

      # The bundle script is the only thing that stamps the version. Read it
      # back off the artifact rather than trusting that it ran.
      - name: Bundle states the same version
        run: |
          PLIST="build/TakeShot.app/Contents/Info.plist"
          BUILT="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' "$PLIST")"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::built bundle says $BUILT, VERSION says $VERSION"
            exit 1
          fi
          echo "TakeShot.app reports $BUILT"

      # After the build, because the notes read the architectures off the
      # binary rather than asserting them. Into build/ (git-ignored) so nothing
      # the release writes can make the checkout dirty.
      - name: Release notes
        run: |
          ./scripts/release-notes.sh "$VERSION" build/TakeShot.app \
            > build/notes.md
          cat build/notes.md

      - name: App DMG
        run: |
          mkdir -p build/dmg-root
          cp -R build/TakeShot.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "TakeShot" -srcfolder build/dmg-root \
            -ov -format UDZO "build/TakeShot-${{ github.ref_name }}.dmg"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No --generate-notes: the body is the operator notes from
          # CHANGELOG.md, and a commit list appended under them buries the two
          # or three lines somebody has to read before installing. The commits
          # stay one link away instead.
          PREVIOUS="$(git describe --tags --abbrev=0 \
            "${{ github.ref_name }}^" 2>/dev/null || true)"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          if [ -n "$PREVIOUS" ]; then
            printf '\n**Every commit since %s:** %s/compare/%s...%s\n' \
              "$PREVIOUS" "$REPO" "$PREVIOUS" "${{ github.ref_name }}" \
              >> build/notes.md
          fi
          gh release create "${{ github.ref_name }}" \
            --title "TakeShot ${{ github.ref_name }}" \
            --notes-file build/notes.md \
            "build/TakeShot-${{ github.ref_name }}.dmg"
