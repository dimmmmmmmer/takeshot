# Project SwiftLint conventions (Codacy picks this up for its SwiftLint tool).
#
# Deliberate deviations from the defaults:
# - identifier_name: video-domain code idiomatically uses short names
#   (tc, pb, x, y, r, g, b, fps…) — length checks off, case checks stay on.
# - trailing_comma: this codebase intentionally keeps trailing commas in
#   multiline collection literals (smaller diffs when appending).
# Everything else stays at defaults so real complexity findings still surface.

# Build output is not source: SwiftPM's generated resource accessors and the
# test runner it synthesizes trip a dozen rules nobody can act on. `.claude`
# holds throwaway worktrees — linting them reports the same file several times
# and mixes half-finished copies into the count.
excluded:
  # EVERY scratch path, by pattern rather than one at a time.
  #
  # Generated sources — `resource_bundle_accessor.swift`, the test runner —
  # are no more lintable than the ones in `.build`, and a build into a scratch
  # path of its own is how this project checks a configuration it does not
  # ship from: the older SDK (`.build-sdk15`, docs/ARCHITECTURE.md), the
  # forced stubs (`.build-stubs`, CLAUDE.md), the shipped one the release
  # workflow tests (`.build-ships`). Each used to be listed by name, so the
  # next check somebody invented turned `lint --strict` red on twenty
  # findings in code nobody wrote — which is a reason not to run the check.
  - .build
  - .build-*
  - .claude

identifier_name:
  min_length: 1
  # L("key") is the project's localization helper — a single capital letter
  # keeps view code readable, and it is used on nearly every UI line.
  excluded:
    - L

disabled_rules:
  - trailing_comma

# The 400-line ceiling measures CODE. The controller's class file is a stored-
# state inventory where nearly every property carries a why-comment (house
# style); counting documentation against the limit pushes the comments out,
# which is exactly backwards.
file_length:
  warning: 400
  ignore_comment_only_lines: true
