<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the layout reaches under the notch; user-scalable=no
     because a scripty scrolling the log must not pinch-zoom the page instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TakeShot</title>
<style>
/* The app's own face, embedded at serve time — see remote.html for why, and
   NOTICE for the licence. */
__TAKESHOT_FONT__
:root {
  --bg: #0b0b0d;
  --panel: #17171b;
  --line: #2a2a31;
  --text: #f2f2f5;
  --dim: #8b8b96;
  --rec: #e0323c;
  --good: #37b24d;
  --bad: #c0392b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  /* The embedded face, with the system stack behind it — see remote.html. */
  font-family: "Resist Sans Display", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
body {
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button {
  font: inherit; color: inherit; border: 1px solid var(--line);
  background: var(--panel); border-radius: 10px;
  touch-action: manipulation; cursor: pointer;
}
button:active { filter: brightness(1.35); }
/* The socket is down: an edit sent now goes nowhere, and a button that still
   presses would lie about it. Comments stay editable — they queue and go out
   when the socket comes back. */
body.off .rate { opacity: 0.35; pointer-events: none; }

header { padding: 12px 16px 8px; text-align: center; }
#tc {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: clamp(28px, 10vw, 48px); font-weight: 600;
  letter-spacing: 0.02em; line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
#tc.stale { color: var(--dim); }
#meta {
  margin-top: 4px; display: flex; gap: 10px; justify-content: center;
  flex-wrap: wrap; color: var(--dim); font-size: 14px;
}
#mode {
  color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 1px 8px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
}
#mode[hidden] { display: none; }
/* What is being shot right now: visible only while a take rolls, so the
   scripty's eye finds the running name and the TC above without hunting. */
#now {
  margin-top: 8px; display: flex; gap: 8px; justify-content: center;
  align-items: baseline; padding: 6px 12px;
  border: 1px solid #43151a; border-radius: 10px; background: #2a1013;
  font-size: 15px;
}
#now[hidden] { display: none; }
#nowLabel { color: #ff6b73; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; font-size: 12px; }
#nowLabel::before {
  content: ""; display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; margin-right: 6px; background: var(--rec);
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
  #nowLabel::before { animation: none; }
}
#nowName {
  font-weight: 700; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; min-width: 0;
}

/* The log itself scrolls; the header and the footer stay put. This page is a
   table to read and annotate, not a button to hit — unlike the operator
   remote, nothing here is worse for being scrolled. */
main {
  flex: 1; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 12px 8px;
}
#empty {
  color: var(--dim); text-align: center; margin: 24px 0;
}
#empty[hidden] { display: none; }
.row {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  padding: 10px; margin: 8px 0;
}
/* Wraps, and that is the whole layout decision. The picture, the name and two
   44pt touch targets do not fit across a 375pt phone — measured, with the name
   down to "PROJ_…" and the timecode broken over two lines. So the rating pair
   is one flex item: it sits beside the name where there is room (landscape, a
   tablet) and drops to a full-width row of its own where there is not, which
   is a larger target rather than a compromised one. */
.rowTop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* The poster frame. A scripty scrolling a day of takes recognises the setup
   from the picture long before they read the name, which is the whole point of
   the column — so it leads the row. The box holds its size whether or not the
   frame has arrived, so a thumbnail landing does not shuffle the rows under
   the finger. */
.rowPoster {
  flex: none; width: 96px; height: 54px; border-radius: 6px;
  overflow: hidden; background: #000; border: 1px solid var(--line);
}
.rowPoster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rowPoster img[hidden] { display: none; }
/* The basis is what makes the line break where it should: a name column
   narrower than this is not worth having, so the rating pair goes below
   instead. min-width: 0 or a long take name refuses to ellipsize and pushes
   the buttons off the side of the phone. */
.rowMeta {
  flex: 1 1 150px; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.rowName {
  font-weight: 700; font-size: 16px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rowWhen {
  color: var(--dim); font-size: 13px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}
.rowRate { flex: 1 1 auto; display: flex; gap: 8px; }
.rate {
  flex: 1 1 auto; height: 44px; min-width: 72px; padding: 0 10px;
  font-size: 14px; font-weight: 700;
}
.rate.good.on { background: var(--good); border-color: var(--good); color: #06210c; }
.rate.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
.note, .slate input {
  width: 100%; margin-top: 8px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text);
  /* 16px is the floor below which mobile Safari zooms the page into the
     field, and the zoom never quite comes back. */
  font-size: 16px; font-family: inherit;
  -webkit-user-select: text; user-select: text;
}
.note::placeholder, .slate input::placeholder { color: var(--dim); }
/* The slate row: scene and shot share the width, the take number is a narrow
   box on the end — the same shape as the card an assistant fills in by hand. */
.slate { display: flex; gap: 8px; }
.slate .scene { flex: 2 1 0; min-width: 0; }
.slate .shot { flex: 1 1 0; min-width: 0; }
.slate .take { flex: 0 0 74px; }

footer {
  display: flex; gap: 12px; justify-content: space-between; align-items: center;
  padding: 10px 16px 16px; color: var(--dim); font-size: 13px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
#conn::before {
  content: ""; display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; margin-right: 7px; background: var(--dim);
  vertical-align: baseline;
}
#conn.live::before { background: var(--good); }
#conn.down::before { background: var(--rec); }

#gate {
  position: fixed; inset: 0; background: rgba(11, 11, 13, 0.97);
  display: none; flex-direction: column; justify-content: center;
  align-items: center; gap: 16px; padding: 24px; text-align: center;
}
#gate.show { display: flex; }
#gate p { margin: 0; color: var(--dim); max-width: 22em; line-height: 1.4; }
#pin {
  width: 100%; max-width: 260px; padding: 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: ui-monospace, Menlo, monospace; font-size: 34px;
  text-align: center; letter-spacing: 0.4em;
  -webkit-user-select: text; user-select: text;
}
#connect { padding: 16px 28px; font-size: 18px; font-weight: 700; }
#gateError { color: var(--rec); min-height: 1.2em; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div id="tc">--:--:--:--</div>
  <div id="meta">
    <span id="mode" hidden></span>
    <span id="format"></span>
  </div>
  <div id="now" hidden>
    <span id="nowLabel"></span>
    <span id="nowName"></span>
  </div>
</header>

<main>
  <p id="empty" hidden></p>
  <div id="log"></div>
</main>

<footer>
  <span id="conn"></span>
  <span id="count"></span>
</footer>

<div id="gate">
  <p id="gateHint"></p>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
         autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="connect"></button>
  <div id="gateError"></div>
</div>

<script>
// Everything is inside a function on purpose, for the same reason as the
// operator page: a top-level `var` becomes a window property, and several of
// the names this page wants (`status` among them) are already taken there.
(function () {
"use strict";
// Injected by RemotePage: the app's current language and its labels.
var CFG = __TAKESHOT_CONFIG__;
var S = CFG.strings;
// The operator page's key, on purpose: it is the same PIN for the same app,
// and a phone that has opened one page should not retype the code on the other.
var PIN_KEY = "takeshot.remote.pin";

document.documentElement.lang = CFG.lang;
document.title = S.title;

var el = function (id) { return document.getElementById(id); };
var socket = null;
var pin = "";
var retry = null;
var retryDelay = 700;
var watchdog = null;
// One record per take id: the row's nodes plus the state the page last saw
// pushed for it, so an edit can be told apart from an echo.
var rows = {};
// Comments typed while the socket was down, keyed by take id. Sent the moment
// a socket authenticates; until then the field keeps the scripty's text
// instead of being clobbered by a replayed log.
var pending = {};
// The same queue for slates: scene/shot/take commit as one message, so one
// entry per take id holds all three.
var pendingSlate = {};
// Rows waiting for their poster frame, and whether one is being fetched.
//
// ONE at a time, deliberately. The server holds eight connection slots for the
// whole set (RemoteServer.maximumClients) and a browser will happily open six
// of them at once for six <img> tags — which on a two-phone unit is every slot
// gone to thumbnails, including the one the next phone needs for its socket.
// A queue costs a fraction of a second per row over a set network and cannot
// starve anybody.
var posterQueue = [];
var posterBusy = false;
// Attempts per row before the page stops asking. A take's frame is decoded off
// the main thread once the file finalizes, so "not yet" is the normal answer to
// the first ask for a take that just landed.
var POSTER_RETRY_MS = 1500;
var POSTER_TRIES = 12;

function text(id, value) { el(id).textContent = value; }

function paintLabels() {
  text("nowLabel", S.recording);
  text("empty", S.empty);
  text("connect", S.connect);
  text("gateHint", S.pinPrompt);
  el("pin").placeholder = "····";
}

function setConnection(state) {
  var node = el("conn");
  node.className = state;
  node.textContent = state === "live" ? S.connected
    : (state === "down" ? S.disconnected : S.connecting);
  // A rating sent into a dead socket goes nowhere; the buttons say so by
  // refusing the press. Comment fields stay editable — those queue.
  document.body.classList.toggle("off", state !== "live");
  if (state !== "live") { el("tc").classList.add("stale"); }
}

// The header: the running TC, the signal, and — while a take rolls — the name
// being written, so the scripty sees what is being shot right now.
function render(next) {
  el("tc").textContent = next.tc || "--:--:--:--";
  el("tc").classList.remove("stale");
  text("format", next.format || S.noSignal);
  var playback = next.mode === "playback";
  el("mode").hidden = !playback;
  if (playback) { text("mode", S.modePlayback); }
  var now = el("now");
  now.hidden = !next.recording;
  if (next.recording) { text("nowName", next.take || ""); }
}

// m:ss from seconds; a take with no known duration shows nothing rather
// than a confident 0:00.
function duration(seconds) {
  if (typeof seconds !== "number" || !isFinite(seconds) || seconds <= 0) {
    return "";
  }
  var whole = Math.round(seconds);
  var secs = whole % 60;
  return Math.floor(whole / 60) + ":" + (secs < 10 ? "0" : "") + secs;
}

function sendRate(id, row) {
  return function () {
    var mine = this.classList.contains("good") ? "good" : "bad";
    // The app's three states: tapping the lit button clears the rating, by
    // name — the page never asks for a toggle it cannot see the outcome of.
    send({ action: "rate", id: id, rating: row.rating === mine ? "none" : mine });
  };
}

function commitComment(id, row) {
  var value = row.note.value;
  if (value === row.pushed) { delete pending[id]; return; }
  pending[id] = value;
  flushPending();
}

// The slate commits as a unit: whichever of the three fields was left, the
// message carries all three, so a half-applied slate can never be pushed back
// between two of them.
function commitSlate(id, row) {
  var slate = { scene: row.scene.value, shot: row.shot.value,
                take: row.take.value };
  if (slate.scene === row.pushedSlate.scene
      && slate.shot === row.pushedSlate.shot
      && slate.take === row.pushedSlate.take) {
    delete pendingSlate[id];
    return;
  }
  pendingSlate[id] = slate;
  flushPending();
}

// Send every queued edit the socket can take. Called on blur and again when a
// socket authenticates — anything typed in a dead spot goes out when the phone
// walks back into coverage.
function flushPending() {
  Object.keys(pending).forEach(function (id) {
    if (send({ action: "comment", id: id, text: pending[id] })) {
      delete pending[id];
    }
  });
  Object.keys(pendingSlate).forEach(function (id) {
    var slate = pendingSlate[id];
    if (send({ action: "slate", id: id, scene: slate.scene,
               shot: slate.shot, take: slate.take })) {
      delete pendingSlate[id];
    }
  });
}

// Ask for one row's frame, one row at a time. Nothing here blocks the page:
// the log is already on screen and each thumbnail fills its own box when it
// arrives, or leaves it black when the take has no readable file.
function pumpPosters() {
  if (posterBusy) { return; }
  var row = posterQueue.shift();
  while (row && (row.posterDone || !row.posterURL)) { row = posterQueue.shift(); }
  if (!row) { return; }
  posterBusy = true;
  row.posterTries += 1;
  // The attempt rides in the URL for the browser, not for the server, which
  // ignores it: the answer to attempt one is a 404 far more often than not,
  // and a phone that cached that would show an empty box for the rest of the
  // shoot.
  row.poster.src = row.posterURL + "&pin=" + encodeURIComponent(pin)
    + "&n=" + row.posterTries;
}

function posterSettled(row, ok) {
  return function () {
    posterBusy = false;
    row.poster.hidden = !ok;
    if (ok) {
      row.posterDone = true;
    } else if (row.posterTries < POSTER_TRIES) {
      setTimeout(function () { queuePoster(row); }, POSTER_RETRY_MS);
    }
    pumpPosters();
  };
}

function queuePoster(row) {
  if (row.posterDone || !row.posterURL) { return; }
  if (posterQueue.indexOf(row) < 0) { posterQueue.push(row); }
  pumpPosters();
}

function makeRow(id) {
  var root = document.createElement("section");
  root.className = "row";
  var top = document.createElement("div");
  top.className = "rowTop";
  var posterBox = document.createElement("div");
  posterBox.className = "rowPoster";
  var poster = document.createElement("img");
  poster.alt = "";
  poster.hidden = true;
  poster.decoding = "async";
  posterBox.appendChild(poster);
  var meta = document.createElement("div");
  meta.className = "rowMeta";
  var name = document.createElement("div");
  name.className = "rowName";
  var when = document.createElement("div");
  when.className = "rowWhen";
  meta.appendChild(name);
  meta.appendChild(when);
  var good = document.createElement("button");
  good.className = "rate good";
  good.textContent = S.good;
  var bad = document.createElement("button");
  bad.className = "rate bad";
  bad.textContent = S.bad;
  // The pair is one flex item so it wraps together — see `.rowRate`.
  var rate = document.createElement("div");
  rate.className = "rowRate";
  rate.appendChild(good);
  rate.appendChild(bad);
  top.appendChild(posterBox);
  top.appendChild(meta);
  top.appendChild(rate);
  var note = document.createElement("input");
  note.className = "note";
  note.type = "text";
  note.placeholder = S.comment;
  note.autocomplete = "off";
  note.spellcheck = false;
  var slate = document.createElement("div");
  slate.className = "slate";
  var scene = slateField("scene", S.scene, "text");
  var shot = slateField("shot", S.shot, "text");
  var take = slateField("take", S.take, "numeric");
  slate.appendChild(scene);
  slate.appendChild(shot);
  slate.appendChild(take);
  root.appendChild(top);
  root.appendChild(slate);
  root.appendChild(note);

  var row = { root: root, name: name, when: when, good: good, bad: bad,
              note: note, scene: scene, shot: shot, take: take,
              poster: poster, posterURL: "", posterTries: 0,
              posterDone: false, rating: "none", pushed: "",
              pushedSlate: { scene: "", shot: "", take: "" } };
  poster.addEventListener("load", posterSettled(row, true));
  poster.addEventListener("error", posterSettled(row, false));
  good.addEventListener("click", sendRate(id, row));
  bad.addEventListener("click", sendRate(id, row));
  // Save on blur; Enter is just a blur, which is what "done" means on a
  // phone keyboard. Never per keystroke — a scripty types through the take.
  note.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { note.blur(); }
  });
  note.addEventListener("blur", function () { commitComment(id, row); });
  [scene, shot, take].forEach(function (field) {
    field.addEventListener("keydown", function (event) {
      if (event.key === "Enter") { field.blur(); }
    });
    field.addEventListener("blur", function () { commitSlate(id, row); });
  });
  rows[id] = row;
  return row;
}

// One slate box. The take field is numeric-only on the phone keyboard, which
// is the difference between a scripty typing "3" and typing "3 " all day.
function slateField(kind, label, mode) {
  var field = document.createElement("input");
  field.className = kind;
  field.type = "text";
  field.placeholder = label;
  field.inputMode = mode;
  field.autocomplete = "off";
  field.spellcheck = false;
  return field;
}

function updateRow(row, take) {
  row.name.textContent = take.name;
  // The route comes from the app, PIN excluded (see RemoteTakeLog.Entry): the
  // page never builds it, so it cannot drift into a broken thumbnail.
  if (take.poster && take.poster !== row.posterURL) {
    row.posterURL = take.poster;
    row.posterDone = false;
    row.posterTries = 0;
    queuePoster(row);
  }
  var when = take.tc || "--:--:--:--";
  var dur = duration(take.dur);
  row.when.textContent = dur ? when + " · " + dur : when;
  row.rating = take.rating;
  row.good.classList.toggle("on", take.rating === "good");
  row.bad.classList.toggle("on", take.rating === "bad");
  row.pushed = take.comment;
  row.pushedSlate = { scene: take.scene || "", shot: take.shot || "",
                      take: take.take || "" };
  // Refresh from pushed state — the operator may have edited in the app —
  // but never clobber a field the scripty is typing in, and never overwrite
  // a comment still queued for a socket that comes back.
  if (document.activeElement !== row.note && !(take.id in pending)) {
    row.note.value = take.comment;
  }
  if (!(take.id in pendingSlate)) {
    [["scene", row.scene], ["shot", row.shot], ["take", row.take]]
      .forEach(function (pair) {
        if (document.activeElement === pair[1]) { return; }
        pair[1].value = row.pushedSlate[pair[0]];
      });
  }
}

// The log, newest on top. Rows are reconciled in place rather than rebuilt:
// rebuilding would blur the comment field mid-word every time a status-sized
// change arrived. A row already in position is not touched, so a new take
// slides in on top without moving the one being edited.
function renderTakes(list) {
  var container = el("log");
  var seen = {};
  var cursor = container.firstChild;
  for (var i = list.length - 1; i >= 0; i--) {
    var take = list[i];
    seen[take.id] = true;
    var row = rows[take.id] || makeRow(take.id);
    updateRow(row, take);
    if (row.root === cursor) {
      cursor = cursor.nextSibling;
    } else {
      container.insertBefore(row.root, cursor);
    }
  }
  Object.keys(rows).forEach(function (id) {
    if (!seen[id]) {
      container.removeChild(rows[id].root);
      // A row still waiting for its frame must stop asking for it: the take is
      // gone from the app, and the queue is the one place holding the node.
      rows[id].posterURL = "";
      delete rows[id];
      delete pending[id];
      delete pendingSlate[id];
    }
  });
  el("empty").hidden = list.length > 0;
  text("count", S.takes + " " + list.length);
}

function showGate(message) {
  el("gateError").textContent = message || "";
  el("gate").classList.add("show");
  el("pin").value = "";
  el("pin").focus();
}

// Same watchdog as the operator page, for the same reason: mobile Safari can
// stop delivering on a socket without a close or an error, and a log that
// silently stopped growing looks exactly like a slow day on set.
function armWatchdog() {
  if (watchdog) { clearTimeout(watchdog); }
  watchdog = setTimeout(function () {
    watchdog = null;
    var dead = socket;
    socket = null;
    if (dead) {
      dead.onopen = dead.onmessage = dead.onclose = dead.onerror = null;
      try { dead.close(); } catch (e) {}
    }
    retryDelay = 700;
    dropped();
  }, CFG.watchdogMs);
}

// One send for every message the page produces; the PIN rides on all of them,
// the way the server demands. Says whether the socket took it, so a comment
// that did not go out can wait in `pending` instead of vanishing.
function send(message) {
  if (!socket || socket.readyState !== 1) { return false; }
  message.pin = pin;
  socket.send(JSON.stringify(message));
  return true;
}

function connect() {
  if (retry) { clearTimeout(retry); retry = null; }
  if (socket && (socket.readyState === 0 || socket.readyState === 1)) { return; }
  if (!pin) { showGate(""); return; }
  setConnection("wait");
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
    + location.host + "/ws");
  armWatchdog();
  socket.onopen = function () {
    socket.send(JSON.stringify({ action: "hello", pin: pin }));
  };
  socket.onmessage = function (event) {
    armWatchdog();
    var msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.type === "status") { render(msg); setConnection("live"); }
    else if (msg.type === "takes") { renderTakes(msg.takes || []); }
    else if (msg.type === "auth" && msg.ok) {
      retryDelay = 700;
      el("gate").classList.remove("show");
      setConnection("live");
      flushPending();
    } else if (msg.type === "auth") {
      pin = "";
      try { localStorage.removeItem(PIN_KEY); } catch (e) {}
      showGate(S.pinBad);
    }
  };
  socket.onclose = function () { dropped(); };
  socket.onerror = function () { dropped(); };
}

// Mobile Safari drops the socket whenever the page goes to the background,
// and gives no error when it does.
function dropped() {
  if (watchdog) { clearTimeout(watchdog); watchdog = null; }
  socket = null;
  setConnection("down");
  if (retry) { return; }
  retry = setTimeout(function () { retry = null; connect(); }, retryDelay);
  retryDelay = Math.min(5000, retryDelay * 2);
}

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { retryDelay = 700; connect(); }
});
window.addEventListener("online", connect);
window.addEventListener("pageshow", connect);

el("connect").addEventListener("click", function () {
  var value = el("pin").value.replace(/\D/g, "");
  if (!value) { return; }
  pin = value;
  try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  el("gate").classList.remove("show");
  connect();
});
el("pin").addEventListener("keydown", function (event) {
  if (event.key === "Enter") { el("connect").click(); }
});

paintLabels();
setConnection("down");
text("count", S.takes + " 0");
el("empty").hidden = false;
try { pin = localStorage.getItem(PIN_KEY) || ""; } catch (e) { pin = ""; }
if (pin) { connect(); } else { showGate(""); }
}());
</script>
