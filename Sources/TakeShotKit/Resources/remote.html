<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the layout reaches under the notch; user-scalable=no
     because a director stabbing at REC must not pinch-zoom the page instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TakeShot</title>
<style>
/* The app's own face, embedded rather than linked: these pages are opened on
   a phone over a set Wi-Fi network that need not have any internet behind it,
   so a page that fetched a font would render in the system face exactly when
   it matters. The @font-face rules with the bytes in them are injected here at
   serve time — the font is a bundle resource, and an .html file cannot reach
   into the app bundle. Two weights only (400 and 700); the 600 and 800 below
   snap to the bold. See NOTICE for the licence. */
__TAKESHOT_FONT__
:root {
  --bg: #0b0b0d;
  --panel: #17171b;
  --line: #2a2a31;
  --text: #f2f2f5;
  --dim: #8b8b96;
  --rec: #e0323c;
  --good: #37b24d;
  --bad: #c0392b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  /* "Resist Sans Display" is the app's own face, embedded above under the
     licence the owner holds (Groteskly Yours — see NOTICE). The system stack
     stays behind it: a build served without the resource, or a browser that
     refuses a woff2, falls straight through to the platform face instead of
     showing nothing. */
  font-family: "Resist Sans Display", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
body {
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button {
  font: inherit; color: inherit; border: 1px solid var(--line);
  background: var(--panel); border-radius: 14px;
  touch-action: manipulation; cursor: pointer;
}
button:disabled { opacity: 0.35; }
button:active:not(:disabled) { filter: brightness(1.35); }

header { padding: 14px 16px 6px; text-align: center; }
#tc {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: clamp(34px, 13vw, 64px); font-weight: 600;
  letter-spacing: 0.02em; line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
#tc.stale { color: var(--dim); }
#meta {
  margin-top: 6px; display: flex; gap: 10px; justify-content: center;
  flex-wrap: wrap; color: var(--dim); font-size: 14px;
}
#take { color: var(--text); font-weight: 600; }

main {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: 14px; padding: 8px 16px 4px; min-height: 0;
}
#rec {
  width: 100%; flex: 1; min-height: 140px; max-height: 46vh;
  border-radius: 24px; border: 2px solid #43151a;
  background: #2a1013; color: #ff6b73;
  font-size: clamp(28px, 9vw, 44px); font-weight: 800; letter-spacing: 0.12em;
}
#rec.on {
  background: var(--rec); border-color: #ff8a90; color: #fff;
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224, 50, 60, 0.55); }
  50% { box-shadow: 0 0 0 16px rgba(224, 50, 60, 0); }
}
@media (prefers-reduced-motion: reduce) {
  #rec.on { animation: none; }
}
#marker { width: 100%; height: 74px; font-size: 20px; font-weight: 700; }
/* Explicit, like #card below: relying on the UA's [hidden] rule breaks the
   moment somebody gives #marker a display of its own. */
#marker[hidden] { display: none; }
/* The playback chip in the header: the reason the marker button is gone. */
#mode {
  color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 1px 8px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
}
#mode[hidden] { display: none; }
#rate { display: flex; gap: 12px; }
#rate button { flex: 1; height: 74px; font-size: 20px; font-weight: 700; }
#good.on { background: var(--good); border-color: var(--good); color: #06210c; }
#bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }

/* The last take: its frame, its name, its rating. Laid out sideways rather
   than as a poster with a caption under it — vertical space on a phone belongs
   to the REC button, and a 16:9 frame 124px wide is still large enough to tell
   two setups apart at arm's length. */
#card {
  display: flex; align-items: center; gap: 12px; padding: 10px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
}
#card[hidden] { display: none; }
#posterBox {
  position: relative; flex: none; width: 124px; height: 70px;
  border-radius: 8px; overflow: hidden; background: #000;
  display: flex; align-items: center; justify-content: center;
}
#poster { width: 100%; height: 100%; object-fit: cover; display: block; }
#poster[hidden] { display: none; }
#posterNote {
  color: var(--dim); font-size: 11px; line-height: 1.2; text-align: center;
  padding: 0 6px;
}
/* min-width: 0 or a long take name refuses to ellipsize and pushes the frame
   off the side of the phone instead. */
#cardMeta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
#cardLabel {
  color: var(--dim); font-size: 11px; letter-spacing: 0.09em;
  text-transform: uppercase;
}
#cardName {
  font-weight: 700; font-size: 17px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#cardRating { font-size: 13px; font-weight: 700; min-height: 1.2em; }
#cardRating.good { color: var(--good); }
#cardRating.bad { color: var(--bad); }

/* A phone laid on its side, or one whose browser chrome has eaten a third of
   the screen. `main` centres its children and does not scroll — deliberately,
   because a REC button that can be scrolled out of reach is worse than a small
   one — so when the card no longer fits, everything gives up a little rather
   than the last thing added being clipped off the bottom. */
@media (max-height: 620px) {
  #rec { min-height: 96px; }
  #marker, #rate button { height: 58px; font-size: 18px; }
  #posterBox { width: 104px; height: 58px; }
  #cardName { font-size: 15px; }
  header { padding: 8px 16px 4px; }
}

footer {
  display: flex; gap: 12px; justify-content: space-between; align-items: center;
  padding: 10px 16px 16px; color: var(--dim); font-size: 13px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
#conn::before {
  content: ""; display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; margin-right: 7px; background: var(--dim);
  vertical-align: baseline;
}
#conn.live::before { background: var(--good); }
#conn.down::before { background: var(--rec); }

#gate {
  position: fixed; inset: 0; background: rgba(11, 11, 13, 0.97);
  display: none; flex-direction: column; justify-content: center;
  align-items: center; gap: 16px; padding: 24px; text-align: center;
}
#gate.show { display: flex; }
#gate p { margin: 0; color: var(--dim); max-width: 22em; line-height: 1.4; }
#pin {
  width: 100%; max-width: 260px; padding: 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: ui-monospace, Menlo, monospace; font-size: 34px;
  text-align: center; letter-spacing: 0.4em;
}
#connect { padding: 16px 28px; font-size: 18px; font-weight: 700; }
#gateError { color: var(--rec); min-height: 1.2em; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div id="tc">--:--:--:--</div>
  <div id="meta">
    <span id="mode" hidden></span>
    <span id="format"></span>
    <span id="take"></span>
  </div>
</header>

<main>
  <button id="rec" disabled></button>
  <button id="marker" disabled></button>
  <div id="rate">
    <button id="good" disabled></button>
    <button id="bad" disabled></button>
  </div>
  <section id="card" hidden>
    <div id="posterBox">
      <img id="poster" alt="" hidden>
      <span id="posterNote"></span>
    </div>
    <div id="cardMeta">
      <span id="cardLabel"></span>
      <span id="cardName"></span>
      <span id="cardRating"></span>
    </div>
  </section>
</main>

<footer>
  <span id="conn"></span>
  <span id="markers"></span>
  <span id="disk"></span>
</footer>

<div id="gate">
  <p id="gateHint"></p>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
         autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="connect"></button>
  <div id="gateError"></div>
</div>

<script>
// Everything is inside a function on purpose. A `var` at the top level of a
// script becomes a property of `window`, and several of the names this page
// wants are already there: `window.status` coerces whatever it is given to a
// string, so a status object assigned to a global `status` came back as
// "[object Object]" and `status.capturing` as undefined — which left the REC
// button disabled through an entire take.
(function () {
"use strict";
// Injected by RemotePage: the app's current language and its labels.
var CFG = __TAKESHOT_CONFIG__;
var S = CFG.strings;
var PIN_KEY = "takeshot.remote.pin";

document.documentElement.lang = CFG.lang;
document.title = S.title;

var el = function (id) { return document.getElementById(id); };
var socket = null;
var pin = "";
var retry = null;
var retryDelay = 700;
var lastStatus = null;
// Whether the socket is up. Module-level because the enablement rule below is
// asked from BOTH the socket-state path and the status path, and a rule that
// each of them keeps its own copy of is a rule that comes to disagree with
// itself — which is exactly what happened between this page and the Mac's
// menus (see `refreshButtons`).
var live = false;
var watchdog = null;
// The take the <img> currently belongs to, whether that fetch has landed, when
// it was last asked for, and how many times. See refreshPoster.
var posterTake = "";
var posterLoaded = false;
var posterAskedAt = 0;
var posterTries = 0;
// How long between poster attempts, and how many before the page stops asking.
// Status pushes arrive four times a second and a take's frame is decoded off
// the main thread after the file finalizes, so "not yet" is normal for a second
// or two — and asking four times a second for a minute is not.
var POSTER_RETRY_MS = 1500;
var POSTER_TRIES = 20;

function text(id, value) { el(id).textContent = value; }

function paintLabels() {
  text("rec", S.rec);
  text("marker", S.marker);
  text("good", S.good);
  text("bad", S.bad);
  text("connect", S.connect);
  text("gateHint", S.pinPrompt);
  text("cardLabel", S.lastTake);
  el("pin").placeholder = "····";
}

function setConnection(state) {
  var node = el("conn");
  node.className = state;
  node.textContent = state === "live" ? S.connected
    : (state === "down" ? S.disconnected : S.connecting);
  live = state === "live";
  refreshButtons();
  if (!live) { el("tc").classList.add("stale"); }
}

// What may be pressed, stated ONCE for the four buttons.
//
// Nothing at all while the socket is down: a queued command that arrives after
// the take ends would fire on the wrong take. Beyond that, each button asks the
// same question its counterpart on the Mac asks, off the two facts the status
// already carries:
//
//   * REC needs a source running (`AppCommands` greys it on `!isCapturing`);
//   * MARKER needs a take being WRITTEN. This page hides the button outright in
//     playback (see `render`), so a marker here is always the rolling take's —
//     and `addMarker()` with nothing rolling falls through both of its branches
//     without a toast or an error;
//   * GOOD/BAD need a take to rate. `toggleLastRating` is
//     `guard let last = takes.last else { return }`.
//
// Ungated — which is how this page shipped — all three were pressable from the
// first second of a shoot and all three were silent. The director presses
// harder; nothing happens; the remote is the thing that looks broken. The Mac's
// menu bar, the status item and the Playback menu all carry these two rules
// already (`AppCommands`, `MenuBarModel`); the phone was the one copy that did
// not.
function refreshButtons() {
  var status = lastStatus;
  var can = function (id) {
    if (!live) { return false; }
    if (!status) { return id !== "rec"; }
    if (id === "rec") { return !!status.capturing; }
    if (id === "marker") { return !!status.recording; }
    return !!status.lastTakeId;
  };
  ["rec", "marker", "good", "bad"].forEach(function (id) {
    el(id).disabled = !can(id);
  });
}

function render(next) {
  lastStatus = next;
  el("tc").textContent = next.tc || "--:--:--:--";
  el("tc").classList.remove("stale");
  text("format", next.format || S.noSignal);
  text("take", next.take || S.idle);
  var rec = el("rec");
  rec.classList.toggle("on", !!next.recording);
  rec.textContent = next.recording ? S.stop : S.rec;
  refreshButtons();
  // The page follows the app's viewer mode; only REC is a static control.
  // In playback the marker button goes away entirely — a marker pressed there
  // lands on whatever frame the laptop happens to be parked on, which is not
  // what a director stabbing "flag that" during a take means — and a chip in
  // the header says which mode the app is in, so the missing button reads as
  // state rather than as a broken page.
  var playback = next.mode === "playback";
  el("marker").hidden = playback;
  el("mode").hidden = !playback;
  if (playback) { text("mode", S.modePlayback); }
  el("good").classList.toggle("on", next.rating === "good");
  el("bad").classList.toggle("on", next.rating === "bad");
  text("markers", S.markers + " " + next.markers);
  text("disk", S.disk + " " + (next.diskGB < 0 ? "—" : next.diskGB + " GB"));
  refreshPoster(next);
}

// The card under the buttons: the last take that landed, its frame, and the
// rating the two buttons above it apply to. Deliberately NOT next.take — while
// a take rolls, that is the name being written, and there is no frame of it
// yet; the card would then caption the previous take's picture with this take's
// name, which is exactly the mistake the card exists to prevent.
function refreshPoster(next) {
  var take = next.lastTakeId || "";
  var card = el("card");
  card.hidden = !take;
  if (!take) { posterTake = ""; return; }
  text("cardName", next.lastTake || S.idle);
  var badge = el("cardRating");
  badge.className = next.rating === "good" ? "good"
    : (next.rating === "bad" ? "bad" : "");
  badge.textContent = next.rating === "good" ? S.good
    : (next.rating === "bad" ? S.bad : "");
  if (take !== posterTake) {
    posterTake = take;
    posterLoaded = false;
    posterAskedAt = 0;
    posterTries = 0;
    el("poster").hidden = true;
    text("posterNote", S.posterWait);
  }
  if (posterLoaded || posterTries >= POSTER_TRIES) { return; }
  var now = Date.now();
  if (now - posterAskedAt < POSTER_RETRY_MS) { return; }
  posterAskedAt = now;
  posterTries += 1;
  // The take id names the frame wanted — the card is about the take that
  // LANDED, and asking for it by name rather than for "the newest" closes the
  // window where a take finalizes between the status push and this fetch. The
  // attempt number is for the browser alone, which the server ignores: a mobile
  // Safari that decides to reuse the response it already has would otherwise
  // show the previous take for the rest of the shoot, and the answer to attempt
  // one is 404 far more often than not.
  el("poster").src = CFG.posterPath + "?pin=" + encodeURIComponent(pin)
    + "&take=" + encodeURIComponent(posterTake) + "&n=" + posterTries;
}

function showGate(message) {
  el("gateError").textContent = message || "";
  el("gate").classList.add("show");
  el("pin").value = "";
  el("pin").focus();
}

// The server's heartbeat is only worth sending if its absence is noticed. A
// phone that loses the network is not always told: mobile Safari can leave the
// socket open and simply stop delivering, with no onclose and no onerror, and a
// page waiting for an event it will not get shows a timecode that stopped
// minutes ago as if it were live — with a REC button that looks pressable.
function armWatchdog() {
  if (watchdog) { clearTimeout(watchdog); }
  watchdog = setTimeout(function () {
    watchdog = null;
    var dead = socket;
    socket = null;
    if (dead) {
      dead.onopen = dead.onmessage = dead.onclose = dead.onerror = null;
      try { dead.close(); } catch (e) {}
    }
    // No backoff: this is a socket that went quiet, not a link the phone has
    // given up on, and the operator wants the readout back.
    retryDelay = 700;
    dropped();
  }, CFG.watchdogMs);
}

function send(action) {
  if (!socket || socket.readyState !== 1) { return; }
  socket.send(JSON.stringify({ action: action, pin: pin }));
}

function connect() {
  if (retry) { clearTimeout(retry); retry = null; }
  if (socket && (socket.readyState === 0 || socket.readyState === 1)) { return; }
  if (!pin) { showGate(""); return; }
  setConnection("wait");
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
    + location.host + "/ws");
  armWatchdog();
  socket.onopen = function () {
    socket.send(JSON.stringify({ action: "hello", pin: pin }));
  };
  socket.onmessage = function (event) {
    armWatchdog();
    var msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.type === "status") { render(msg); setConnection("live"); }
    else if (msg.type === "auth" && msg.ok) {
      retryDelay = 700;
      // A fresh socket is a fresh chance at the poster: the page may have run
      // out of attempts against a code that has since been re-entered, or
      // against a take whose frame had not finished decoding an hour ago.
      posterTries = 0;
      posterAskedAt = 0;
      el("gate").classList.remove("show");
      setConnection("live");
    } else if (msg.type === "auth") {
      pin = "";
      try { localStorage.removeItem(PIN_KEY); } catch (e) {}
      showGate(S.pinBad);
    }
  };
  socket.onclose = function () { dropped(); };
  socket.onerror = function () { dropped(); };
}

// Mobile Safari drops the socket whenever the page goes to the background, and
// gives no error when it does — without this the page comes back showing a
// timecode that stopped minutes ago.
function dropped() {
  if (watchdog) { clearTimeout(watchdog); watchdog = null; }
  socket = null;
  setConnection("down");
  if (retry) { return; }
  retry = setTimeout(function () { retry = null; connect(); }, retryDelay);
  retryDelay = Math.min(5000, retryDelay * 2);
}

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { retryDelay = 700; connect(); }
});
window.addEventListener("online", connect);
window.addEventListener("pageshow", connect);

el("poster").addEventListener("load", function () {
  posterLoaded = true;
  posterTries = 0;
  el("poster").hidden = false;
  text("posterNote", "");
});
// An <img> cannot see a status code, so 404 (no frame decoded yet) and 403 (a
// PIN that has been rotated) arrive here the same way. Both are answered by
// trying again on the next status push and giving up after POSTER_TRIES: a
// rotated code sends the page back to the gate through the socket anyway.
el("poster").addEventListener("error", function () {
  posterLoaded = false;
  el("poster").hidden = true;
  text("posterNote", S.posterWait);
});

el("rec").addEventListener("click", function () { send("rec"); });
el("marker").addEventListener("click", function () { send("marker"); });
el("good").addEventListener("click", function () { send("good"); });
el("bad").addEventListener("click", function () { send("bad"); });
el("connect").addEventListener("click", function () {
  var value = el("pin").value.replace(/\D/g, "");
  if (!value) { return; }
  pin = value;
  try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  el("gate").classList.remove("show");
  connect();
});
el("pin").addEventListener("keydown", function (event) {
  if (event.key === "Enter") { el("connect").click(); }
});

paintLabels();
setConnection("down");
try { pin = localStorage.getItem(PIN_KEY) || ""; } catch (e) { pin = ""; }
if (pin) { connect(); } else { showGate(""); }
}());
</script>
</body>
</html>
