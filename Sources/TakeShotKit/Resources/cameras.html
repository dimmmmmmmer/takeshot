<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the tiles reach under the notch; user-scalable=no
     because a pinch here should never zoom the page around the video. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TakeShot</title>
<style>
/* The app's own face, embedded at serve time — see remote.html for why, and
   NOTICE for the licence. */
__TAKESHOT_FONT__
:root {
  --bg: #0b0b0d;
  --panel: #17171b;
  --line: #2a2a31;
  --text: #f2f2f5;
  --dim: #8b8b96;
  --rec: #e0323c;
  --good: #37b24d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  /* The embedded face, with the system stack behind it — see remote.html. */
  font-family: "Resist Sans Display", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
body {
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button {
  font: inherit; color: inherit; border: 1px solid var(--line);
  background: var(--panel); border-radius: 10px;
  touch-action: manipulation; cursor: pointer;
}
button:active { filter: brightness(1.35); }
/* The socket is down: what the tiles show stopped moving, and the page says
   so by dimming them rather than presenting a still as live video. */
body.off #grid { opacity: 0.45; }

/* The grid is the page. One camera fills it; two stack in portrait and sit
   side by side in landscape; more than two wrap onto a 2-across grid. */
#grid {
  flex: 1; min-height: 0; display: grid; gap: 2px;
}
#grid[data-count="2"] { grid-template-rows: 1fr 1fr; }
@media (orientation: landscape) {
  #grid[data-count="2"] {
    grid-template-rows: none; grid-template-columns: 1fr 1fr;
  }
}
#grid[data-count="many"] {
  grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr;
}
.tile {
  position: relative; overflow: hidden; background: #000;
  min-width: 0; min-height: 0; cursor: pointer;
}
.tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
/* Tapping a tile goes fullscreen on that camera; tapping again comes back.
   CSS only — the stream underneath does not change. */
.tile.full { position: fixed; inset: 0; z-index: 5; }
.tag {
  position: absolute; top: 8px; left: 8px;
  display: flex; gap: 8px; align-items: center;
  background: rgba(11, 11, 13, 0.65); border-radius: 8px;
  padding: 3px 9px; font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em; pointer-events: none;
}
.rec { display: none; color: #ff6b73; text-transform: uppercase; }
.rec::before {
  content: ""; display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; margin-right: 5px; background: var(--rec);
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
  .rec::before { animation: none; }
}
.tile.rec .rec { display: inline-block; }
/* Until the first frame lands the tile says so, instead of showing a black
   rectangle that reads as a dead camera. */
.wait {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;
  color: var(--dim); font-size: 14px; pointer-events: none;
}
.tile.hasFrame .wait { display: none; }

footer {
  display: flex; gap: 12px; justify-content: space-between; align-items: center;
  padding: 10px 16px 16px; color: var(--dim); font-size: 13px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
#conn::before {
  content: ""; display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; margin-right: 7px; background: var(--dim);
  vertical-align: baseline;
}
#conn.live::before { background: var(--good); }
#conn.down::before { background: var(--rec); }
#tc {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

#gate {
  position: fixed; inset: 0; background: rgba(11, 11, 13, 0.97);
  display: none; flex-direction: column; justify-content: center;
  align-items: center; gap: 16px; padding: 24px; text-align: center;
  z-index: 10;
}
#gate.show { display: flex; }
#gate p { margin: 0; color: var(--dim); max-width: 22em; line-height: 1.4; }
#pin {
  width: 100%; max-width: 260px; padding: 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: ui-monospace, Menlo, monospace; font-size: 34px;
  text-align: center; letter-spacing: 0.4em;
  -webkit-user-select: text; user-select: text;
}
#connect { padding: 16px 28px; font-size: 18px; font-weight: 700; }
#gateError { color: var(--rec); min-height: 1.2em; font-size: 14px; }
</style>
</head>
<body>
<div id="grid" data-count="1"></div>

<footer>
  <span id="conn"></span>
  <span id="tc">--:--:--:--</span>
</footer>

<div id="gate">
  <p id="gateHint"></p>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
         autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="connect"></button>
  <div id="gateError"></div>
</div>

<script>
// Everything is inside a function on purpose, for the same reason as the
// other pages: a top-level `var` becomes a window property, and several of
// the names this page wants are already taken there.
(function () {
"use strict";
// Injected by RemotePage: the app's current language and its labels.
var CFG = __TAKESHOT_CONFIG__;
var S = CFG.strings;
// The operator page's key, on purpose: it is the same PIN for the same app,
// and a phone that has opened one page should not retype the code on another.
var PIN_KEY = "takeshot.remote.pin";

document.documentElement.lang = CFG.lang;
document.title = S.title;

var el = function (id) { return document.getElementById(id); };
var socket = null;
var pin = "";
var retry = null;
var retryDelay = 700;
var watchdog = null;
// One record per camera index — the byte in front of every binary frame.
var tiles = [];

// Whether a tap leaves the tapped tile fullscreen.
//
// Entering is pointless with one tile — it already IS the whole screen — but
// LEAVING never is, and that is the bug this replaces: the tap handler refused
// both directions on `tiles.length < 2`, and the count can drop to one UNDER a
// tile that is already fullscreen (a board dropping out of the multicam set
// pops the OTHER tile — see ensureTiles). The fullscreen tile then covered the
// footer, the TC and the connection dot, and nothing but a page reload cleared
// it. Pure, and the whole rule, so it can be checked without a DOM.
function wantsFullscreen(wasFull, count) {
  return !wasFull && count > 1;
}

// Take every tile out of fullscreen. Also called when the grid shrinks: a lone
// tile has nothing to be fullscreen OVER, so the state is corrected rather than
// left for the operator to find and tap their way out of.
function clearFullscreen() {
  tiles.forEach(function (tile) { tile.root.classList.remove("full"); });
}

function makeTile() {
  var root = document.createElement("div");
  root.className = "tile";
  var img = document.createElement("img");
  img.alt = "";
  var wait = document.createElement("div");
  wait.className = "wait";
  wait.textContent = S.wait;
  var tag = document.createElement("div");
  tag.className = "tag";
  var name = document.createElement("span");
  var rec = document.createElement("span");
  rec.className = "rec";
  rec.textContent = S.rec;
  tag.appendChild(name);
  tag.appendChild(rec);
  root.appendChild(img);
  root.appendChild(wait);
  root.appendChild(tag);
  // Fullscreen one camera on tap, back on the next tap. The way OUT is never
  // refused — see wantsFullscreen.
  root.addEventListener("click", function () {
    var was = root.classList.contains("full");
    clearFullscreen();
    if (wantsFullscreen(was, tiles.length)) { root.classList.add("full"); }
  });
  var tile = { root: root, img: img, name: name, url: null };
  el("grid").appendChild(root);
  return tile;
}

// Grow or shrink the grid to the camera count the status carries. Multicam
// switching mid-shift lands here like anything else — no reload.
function ensureTiles(count) {
  var want = Math.max(1, count);
  while (tiles.length < want) { tiles.push(makeTile()); }
  while (tiles.length > want) {
    var gone = tiles.pop();
    gone.root.remove();
    if (gone.url) { URL.revokeObjectURL(gone.url); }
  }
  if (want < 2) { clearFullscreen(); }
  el("grid").setAttribute("data-count", want > 2 ? "many" : String(want));
}

// The footer TC plus each tile's label and REC light — the light is that
// camera's own recording state, which in multicam is not the app's.
function render(next) {
  el("tc").textContent = next.tc || "--:--:--:--";
  var cameras = next.cameras || [];
  ensureTiles(cameras.length || 1);
  tiles.forEach(function (tile, index) {
    var camera = cameras[index];
    tile.name.textContent = camera ? camera.name : "";
    tile.root.classList.toggle("rec", !!(camera && camera.recording));
  });
}

// One binary message: a camera byte, then the JPEG. The old blob URL is
// revoked only once the new frame has loaded, so the tile never flashes.
function showFrame(bytes) {
  if (bytes.length < 2) { return; }
  var tile = tiles[bytes[0]];
  if (!tile) { return; }
  var url = URL.createObjectURL(new Blob([bytes.subarray(1)],
                                         { type: "image/jpeg" }));
  var old = tile.url;
  tile.url = url;
  var done = function () { if (old) { URL.revokeObjectURL(old); } };
  tile.img.onload = done;
  tile.img.onerror = done;
  tile.img.src = url;
  tile.root.classList.add("hasFrame");
}

function setConnection(state) {
  var node = el("conn");
  node.className = state;
  node.textContent = state === "live" ? S.connected
    : (state === "down" ? S.disconnected : S.connecting);
  document.body.classList.toggle("off", state !== "live");
}

// The gate's own labels, like the other two pages paint theirs. This page did
// not, so a phone opening it first met an unlabelled field and a blank button —
// the strings were injected and never read.
function paintLabels() {
  el("gateHint").textContent = S.pinPrompt;
  el("connect").textContent = S.connect;
  el("pin").placeholder = "····";
}

function showGate(message) {
  el("gateError").textContent = message || "";
  el("gate").classList.add("show");
  el("pin").value = "";
  el("pin").focus();
}

// Same watchdog as the other pages, for the same reason: mobile Safari can
// stop delivering on a socket without a close or an error, and a grid that
// silently froze looks exactly like a locked-off camera.
function armWatchdog() {
  if (watchdog) { clearTimeout(watchdog); }
  watchdog = setTimeout(function () {
    watchdog = null;
    var dead = socket;
    socket = null;
    if (dead) {
      dead.onopen = dead.onmessage = dead.onclose = dead.onerror = null;
      try { dead.close(); } catch (e) {}
    }
    retryDelay = 700;
    dropped();
  }, CFG.watchdogMs);
}

// One send for every message the page produces; the PIN rides on all of
// them, the way the server demands.
function send(message) {
  if (!socket || socket.readyState !== 1) { return false; }
  message.pin = pin;
  socket.send(JSON.stringify(message));
  return true;
}

function connect() {
  if (retry) { clearTimeout(retry); retry = null; }
  if (socket && (socket.readyState === 0 || socket.readyState === 1)) { return; }
  if (!pin) { showGate(""); return; }
  setConnection("wait");
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
    + location.host + "/ws");
  // The frames are bytes; without this they arrive as Blobs, which cost an
  // extra async read before the camera byte can even be looked at.
  socket.binaryType = "arraybuffer";
  armWatchdog();
  socket.onopen = function () {
    socket.send(JSON.stringify({ action: "hello", pin: pin }));
  };
  socket.onmessage = function (event) {
    armWatchdog();
    if (event.data instanceof ArrayBuffer) {
      showFrame(new Uint8Array(event.data));
      return;
    }
    var msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.type === "status") { render(msg); setConnection("live"); }
    else if (msg.type === "auth" && msg.ok) {
      retryDelay = 700;
      el("gate").classList.remove("show");
      setConnection("live");
      // The subscription: frames flow only after this, so a page that never
      // asks costs the recorder nothing.
      // "multiview" is the wire name of the frame STREAM and stays as it is;
      // the page this arrives on is the cameras page (see RemoteLink).
      send({ action: "multiview", on: true });
    } else if (msg.type === "auth") {
      pin = "";
      try { localStorage.removeItem(PIN_KEY); } catch (e) {}
      showGate(S.pinBad);
    }
  };
  socket.onclose = function () { dropped(); };
  socket.onerror = function () { dropped(); };
}

// Mobile Safari drops the socket whenever the page goes to the background,
// and gives no error when it does.
function dropped() {
  if (watchdog) { clearTimeout(watchdog); watchdog = null; }
  socket = null;
  setConnection("down");
  if (retry) { return; }
  retry = setTimeout(function () { retry = null; connect(); }, retryDelay);
  retryDelay = Math.min(5000, retryDelay * 2);
}

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { retryDelay = 700; connect(); }
});
window.addEventListener("online", connect);
window.addEventListener("pageshow", connect);

el("connect").addEventListener("click", function () {
  var value = el("pin").value.replace(/\D/g, "");
  if (!value) { return; }
  pin = value;
  try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  el("gate").classList.remove("show");
  connect();
});
el("pin").addEventListener("keydown", function (event) {
  if (event.key === "Enter") { el("connect").click(); }
});

paintLabels();
setConnection("down");
ensureTiles(1);
try { pin = localStorage.getItem(PIN_KEY) || ""; } catch (e) { pin = ""; }
if (pin) { connect(); } else { showGate(""); }
}());
</script>
</body>
</html>
